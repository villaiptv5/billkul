# Builds an installable Android test app on every push to main, and on demand.
# The finished .apk is attached to a pre-release on the repository's Releases page,
# so it can be downloaded straight onto a phone.
name: Android test build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'pc-preview/**'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Account server tests
        run: php server/tests/run.php

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Publish the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="BillKul-test-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "test-${{ github.run_number }}" "$APK" \
            --prerelease \
            --title "Test build ${{ github.run_number }}" \
            --notes "Installable test build of BillKul. It is signed with a test key, so it is for trying on your own phone, not for Google Play."
